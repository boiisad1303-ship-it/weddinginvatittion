services:
    app:
        build:
            context: .
        ports:
            - "${APP_PORT:-8080}:80"
        environment:
            APP_ENV: local
            APP_DEBUG: "true"
            APP_KEY: ${APP_KEY:-base64:6WB39DMRuLYpsEMgqeP6YvX4KjEy5EYggKjSqokB3A=}
            APP_URL: ${APP_URL:-http://localhost:8080}
            DB_CONNECTION: mysql
            DB_HOST: db
            DB_PORT: 3306
            DB_DATABASE: weddinginvitation
            DB_USERNAME: wedding
            DB_PASSWORD: wedding-local-only
            PORT: 80
        depends_on:
            db:
                condition: service_healthy

    db:
        image: mysql:8.0
        environment:
            MYSQL_DATABASE: weddinginvitation
            MYSQL_USER: wedding
            MYSQL_PASSWORD: wedding-local-only
            MYSQL_ROOT_PASSWORD: root-local-only
        volumes:
            - mysql-data:/var/lib/mysql
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent",
                ]
            interval: 5s
            timeout: 5s
            retries: 20

volumes:
    mysql-data:
